plugins {
    id "io.micronaut.build.internal.bom"
}

micronautBom {
    excludeProject.set({ p ->
        p.group.contains('example') || p.name.contains('example') || p.name.contains('test-')
    } as Spec<Project>)

    suppressions {
        // We used to erroneously manage testcontainers (prior to 5.2.0)
        acceptedLibraryRegressions.add("boms-testcontainers")
        acceptedVersionRegressions.add("testcontainers")
        // Removed reactor-netty-http added in 5.6.0 and now using mnReactor BOM
        acceptedVersionRegressions.add("reactor-netty")
        acceptedLibraryRegressions.add("reactor-netty-http")
        // Removed dev-miku mysql dependency and renamed r2dbc-io-asyncer-mysql to r2dbc-mysql as offically supported
        // mysql r2dbc library
        acceptedLibraryRegressions.add("r2dbc-io-asyncer-mysql")
        acceptedVersionRegressions.add("r2dbc-io-asyncer-mysql")
    }
}

