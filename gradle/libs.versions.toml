[versions]
micronaut = "5.1.13"
micronaut-platform = "5.1.3"
micronaut-docs = "3.0.0"
micronaut-reactor = "4.2.0"
micronaut-rxjava3 = "4.1.0"
micronaut-serde = "3.1.1"
micronaut-kotlin = "5.1.0"
micronaut-data = "5.1.3"
micronaut-sql = "7.1.2"
micronaut-flyway = "8.1.1"
micronaut-validation = "5.1.0"
micronaut-logging = "2.1.0"
micronaut-micrometer = "6.0.2"

groovy = "5.0.3"

# R2DBC Drivers

managed-r2dbc = "1.0.0.RELEASE"
managed-r2dbc-pool = "1.0.2.RELEASE"

managed-r2dbc-oracle = "1.3.0"
managed-r2dbc-mysql = "1.4.3"
managed-r2dbc-h2 = "1.1.0.RELEASE"
managed-r2dbc-mariadb = "1.4.2"
managed-r2dbc-postgresql = "1.1.2.RELEASE"
managed-r2dbc-mssql = "1.0.6.RELEASE"
managed-cloud-sql-connector = "1.30.0"

# Gradle plugins

micronaut-gradle-plugin = "5.0.2"
micronaut-test-resources = "4.2.0"

[libraries]
# Core
micronaut-core = { module = 'io.micronaut:micronaut-core-bom', version.ref = 'micronaut' }

# BOMS
micronaut-reactor = { module = 'io.micronaut.reactor:micronaut-reactor-bom', version.ref = "micronaut-reactor" }
micronaut-rxjava3 = { module = 'io.micronaut.rxjava3:micronaut-rxjava3-bom', version.ref = "micronaut-rxjava3" }
micronaut-kotlin = { module = 'io.micronaut.kotlin:micronaut-kotlin-bom', version.ref = "micronaut-kotlin" }
micronaut-serde = { module = "io.micronaut.serde:micronaut-serde-bom", version.ref = "micronaut-serde" }
micronaut-data = { module = "io.micronaut.data:micronaut-data-bom", version.ref = "micronaut-data" }
micronaut-sql = { module = "io.micronaut.sql:micronaut-sql-bom", version.ref = "micronaut-sql" }
micronaut-flyway = { module = "io.micronaut.flyway:micronaut-flyway-bom", version.ref = "micronaut-flyway" }
micronaut-test-resources = { module = "io.micronaut.testresources:micronaut-test-resources-bom", version.ref = "micronaut-test-resources" }
micronaut-validation = { module = "io.micronaut.validation:micronaut-validation-bom", version.ref = "micronaut-validation" }
micronaut-logging = { module = "io.micronaut.logging:micronaut-logging-bom", version.ref = "micronaut-logging" }
micronaut-micrometer = { module = "io.micronaut.micrometer:micronaut-micrometer-core", version.ref = "micronaut-micrometer" }

# R2DBC API

managed-r2dbc-spi = { module = "io.r2dbc:r2dbc-spi", version.ref = "managed-r2dbc" }
managed-r2dbc-pool = { module = "io.r2dbc:r2dbc-pool", version.ref = "managed-r2dbc-pool" }

# R2DBC Drivers
managed-r2dbc-h2 = { module = "io.r2dbc:r2dbc-h2", version.ref = "managed-r2dbc-h2" }
managed-r2dbc-oracle = { module = "com.oracle.database.r2dbc:oracle-r2dbc", version.ref = "managed-r2dbc-oracle" }
managed-r2dbc-mariadb = { module = "org.mariadb:r2dbc-mariadb", version.ref = "managed-r2dbc-mariadb" }
managed-r2dbc-mysql = { module = "io.asyncer:r2dbc-mysql", version.ref = "managed-r2dbc-mysql" }
managed-r2dbc-mssql = { module = "io.r2dbc:r2dbc-mssql", version.ref = "managed-r2dbc-mssql" }
managed-r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql", version.ref = "managed-r2dbc-postgresql" }
managed-cloud-sql-connector-r2dbc-postgres = { module = "com.google.cloud.sql:cloud-sql-connector-r2dbc-postgres", version.ref = "managed-cloud-sql-connector" }

testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }

junit-platform-engine = { module = "org.junit.platform:junit-platform-suite-engine" }
# Testresources

micronaut-testresources-client = { module = 'io.micronaut.testresources:micronaut-test-resources-client', version.ref = "micronaut-test-resources" }

# Gradle
gradle-micronaut = { module = "io.micronaut.gradle:micronaut-gradle-plugin", version.ref = "micronaut-gradle-plugin" }
