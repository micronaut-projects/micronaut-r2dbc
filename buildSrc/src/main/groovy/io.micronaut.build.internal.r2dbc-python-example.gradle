/*
 * Convention for the Python documentation example (doc-examples/example-python).
 *
 * Mirrors io.micronaut.build.internal.r2dbc-example for sources compiled by the Python compiler
 * (micronaut-inject-python). The Python compiler takes the (jar-resolved) compile classpath as its
 * annotation processor path, so the Micronaut processors are regular test dependencies of the
 * project, not annotationProcessor ones. The Python tests only run with -Ppython-ci.
 */
plugins {
    id "io.micronaut.build.internal.r2dbc-dependencies"
    id "io.micronaut.minimal.library"
    id "io.micronaut.build.internal.java-base"
    id "io.micronaut.build.internal.python"
}

micronaut {
    importMicronautPlatform = false
    version libs.versions.micronaut.platform.get()
}

dependencies {
    micronautBoms(platform(mn.micronaut.core.bom))
    micronautBoms(platform(mnData.micronaut.data.bom))
    micronautBoms(platform(mnLogging.micronaut.logging.bom))
    micronautBoms(platform(mnTest.micronaut.test.bom))
    micronautBoms(platform(mnFlyway.micronaut.flyway.bom))
    micronautBoms(platform(mnSerde.micronaut.serde.bom))

    // The Java helpers in src/test/java are processed by javac
    testAnnotationProcessor(mn.micronaut.inject.java)

    // Processors of the Python sources (compile classpath, see above)
    implementation(mn.micronaut.inject.python)
    implementation(mn.micronaut.context.python)
    implementation(mnData.micronaut.data.processor)
    implementation(mnSerde.micronaut.serde.processor)
    testImplementation(mn.micronaut.inject.python.test)

    implementation projects.micronautR2dbcCore
    implementation(mnData.micronaut.data.r2dbc) {
        exclude module:'micronaut-r2dbc-core'
    }
    implementation(mnFlyway.micronaut.flyway)
    implementation(mnSql.micronaut.jdbc.hikari)
    implementation(mnSerde.micronaut.serde.jackson)
    implementation(mn.micronaut.http.server.netty)

    runtimeOnly(libs.managed.r2dbc.mysql)
    runtimeOnly(mnSql.mysql.connector.j)
    runtimeOnly(mnFlyway.flyway.mysql)
    runtimeOnly mn.snakeyaml

    testImplementation(mn.micronaut.http.client)
    testImplementation(mnTestResources.testcontainers.mysql)
    testImplementation(mnTest.micronaut.test.junit5)
    testRuntimeOnly mnLogging.logback.classic
    testRuntimeOnly mnTest.junit.jupiter.engine
    testRuntimeOnly mnTest.junit.platform.launcher
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty "micronaut.python.pool.enabled", "false"
}
