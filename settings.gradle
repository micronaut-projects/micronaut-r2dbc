plugins {
    id 'io.micronaut.build.shared.settings' version '8.1.5'
}

enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS")

// Micronaut core 5.3.0-SNAPSHOT, which carries the development-mode API, comes from the Central snapshots
// repository; only io.micronaut snapshots are resolved from it. Projects declare their own repositories, which
// replace the settings ones, so it is added to each project too.
// Remove once the build moves to a core release.
def micronautSnapshotRepositories = { RepositoryHandler repositories ->
    repositories.maven {
        url = "https://central.sonatype.com/repository/maven-snapshots/"
        mavenContent {
            snapshotsOnly()
        }
        content {
            includeGroupByRegex("io\\.micronaut(\\..*)?")
        }
    }
}
dependencyResolutionManagement {
    micronautSnapshotRepositories(repositories)
    repositories {
        mavenCentral()
    }
}
gradle.beforeProject {
    micronautSnapshotRepositories(it.repositories)
}

micronautBuild {
    useStandardizedProjectNames = true
    importMicronautCatalog()
    importMicronautCatalog("micronaut-reactor")
    importMicronautCatalog("micronaut-rxjava3")
    importMicronautCatalog("micronaut-serde")
    importMicronautCatalog("micronaut-kotlin")
    importMicronautCatalog("micronaut-data")
    importMicronautCatalog("micronaut-sql")
    importMicronautCatalog("micronaut-flyway")
    importMicronautCatalog("micronaut-test-resources")
    importMicronautCatalog("micronaut-validation")
}
rootProject.name = 'r2dbc-parent'

include 'r2dbc-bom'
include 'r2dbc-core'

// examples
include 'doc-examples:example-groovy'
include 'doc-examples:example-java'
include 'doc-examples:example-kotlin'
include 'doc-examples:example-python'

// tests
include 'test-suite-dev-reload'
include 'test-graalvm'
include 'test-graalvm:h2'
include 'test-graalvm:mariadb'
include 'test-graalvm:mssql'
include 'test-graalvm:mysql'
include 'test-graalvm:oracle'
include 'test-graalvm:postgres'
include 'test-graalvm:common'
include 'test-graalvm:common-tests'

